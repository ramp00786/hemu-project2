<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sample questions · Voice RAG</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Devanagari"', "system-ui", "sans-serif"],
          },
          colors: {
            chat: { bg: "#212121", panel: "#171717", bubble: "#2f2f2f", line: "#424242" },
          },
        },
      },
    };
  </script>
</head>
<body class="min-h-dvh bg-chat-bg font-sans text-zinc-100 antialiased">
  <header class="flex h-14 items-center justify-between border-b border-white/5 px-4">
    <a href="/" class="flex items-center gap-2.5">
      <div class="grid h-8 w-8 place-items-center rounded-full bg-gradient-to-br from-emerald-400 to-sky-500 text-sm font-bold text-zinc-950">R</div>
      <div>
        <p class="text-sm font-semibold leading-none">Voice RAG</p>
        <p class="mt-0.5 text-[11px] text-zinc-500">Sample questions from chunks.json</p>
      </div>
    </a>
    <a href="/" class="rounded-full border border-white/10 px-3 py-1.5 text-xs font-medium text-zinc-300 transition hover:bg-white/5">Ask</a>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-10">
    <h1 class="text-3xl font-semibold tracking-tight">Sample questions</h1>
    <p class="mt-2 max-w-xl text-sm text-zinc-400">These MSMARCO-XI questions have a selected English passage in the index. Hindi translations appear below when available.</p>
    <p id="meta" class="mt-3 text-[11px] text-zinc-500"></p>
    <div id="list" class="mt-8 grid gap-3"></div>
  </main>

  <script>
    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    const list = document.getElementById("list");
    const meta = document.getElementById("meta");

    fetch("/api/sample-questions")
      .then((r) => r.json())
      .then((data) => {
        const rows = data.questions || [];
        meta.textContent = rows.length + " questions · grounded in chunks.json";
        if (!rows.length) {
          list.innerHTML = '<p class="text-sm text-zinc-400">No sample questions found in chunks.json.</p>';
          return;
        }
        list.innerHTML = rows.map((row) => {
          const q = row.query_en || row.question || row.query_hi || "";
          const hi = row.query_hi && row.query_hi !== q ? row.query_hi : "";
          const type = row.query_type || "";
          const href = "/?q=" + encodeURIComponent(q);
          return `<a href="${href}" class="block rounded-2xl border border-white/10 bg-chat-bubble px-4 py-4 transition hover:border-emerald-400/40 hover:bg-white/5">
            <div class="flex items-start justify-between gap-3">
              <p class="text-[15px] leading-relaxed text-zinc-100">${escapeHtml(q)}</p>
              ${type ? `<span class="shrink-0 rounded-full bg-white/10 px-2 py-0.5 text-[10px] uppercase tracking-wide text-zinc-400">${escapeHtml(type)}</span>` : ""}
            </div>
            ${hi ? `<p class="mt-1.5 text-xs text-zinc-500">${escapeHtml(hi)}</p>` : ""}
          </a>`;
        }).join("");
      })
      .catch((err) => {
        meta.textContent = "";
        list.innerHTML = `<p class="text-sm text-red-400">${escapeHtml(String(err))}</p>`;
      });
  </script>
</body>
</html>
